<!doctype html>
<html lang="gu">
<head>
<meta charset="utf-8">
<title>ફોટો ગેલેરી — મોબાઇલ</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anek+Gujarati:wdth,wght@75..125,500..800&amp;family=Hind+Vadodara:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#FFFFFF;color:#1C1F26;font-family:"Hind Vadodara","Noto Sans Gujarati",system-ui,sans-serif;font-size:17px;line-height:1.7}
*{box-sizing:border-box}
h1,h2,h3{margin:0;font-family:"Anek Gujarati","Hind Vadodara",sans-serif;font-stretch:92%;font-weight:700;line-height:1.25}
p{margin:0}
a{color:inherit}
button{font:inherit;color:inherit}
.d{font-family:"Anek Gujarati","Hind Vadodara",sans-serif;font-stretch:92%}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 10px;border-radius:12px;font-weight:600;font-size:17px;text-decoration:none;border:0;cursor:pointer;white-space:nowrap}
.btn svg{width:22px;height:22px;flex:none}
.bw{background:#1DA851;color:#FFFFFF;font-size:18px;font-weight:700}
.bg{background:transparent;border:1.5px solid #E3E3EA;color:#1C1F26}
.chip{flex:none;height:44px;padding:0 16px;border-radius:999px;border:1.5px solid #E3E3EA;background:#FFFFFF;font-weight:500;white-space:nowrap;cursor:pointer}
.chip.on{background:#19203F;border-color:#19203F;color:#FFFFFF}
.mut{color:#5B6070}
.tile{position:relative;display:grid;place-items:center;aspect-ratio:1;border-radius:12px;overflow:hidden;text-decoration:none}
.lab{position:absolute;left:8px;bottom:6px;font-size:12.5px;color:#5B6070;line-height:1.4}
</style>
</helmet>
<div style="width:360px;height:2500px;background:#FFFFFF;display:flex;flex-direction:column;position:relative;overflow:hidden">

<header style="height:64px;border-bottom:1px solid #E3E3EA;background:#FFFFFF;flex:none;display:flex;align-items:center;gap:8px;padding:0 14px">
<a href="HomeMobile.dc.html" aria-label="દવડા ઍગ્રો ઇન્ડસ્ટ્રીઝ" style="display:flex;align-items:center;gap:8px;text-decoration:none;margin-right:auto;min-width:0">
<svg width="30" height="30" viewBox="0 0 40 40" aria-hidden="true" style="flex:none"><rect width="40" height="40" rx="10" fill="#19203F"/><path d="M13 32c0-7 3-13 6-17h2c3 4 6 10 6 17z" fill="#E07B16"/><ellipse cx="20" cy="14.5" rx="3" ry="1.2" fill="#E07B16"/><path d="M20 13V6l6 1.6L20 9" fill="#F4A94E" stroke="#F4A94E" stroke-width=".6"/></svg>
<span style="display:flex;flex-direction:column;min-width:0"><b class="d" style="font-weight:800;font-size:15.5px;line-height:1.15;font-stretch:82%;white-space:nowrap">દવડા ઍગ્રો ઇન્ડસ્ટ્રીઝ</b><small class="mut" style="font-size:12.5px;line-height:1.3">ચિતલ, અમરેલી</small></span>
</a>
<label style="display:flex;align-items:center;gap:4px;border:1px solid #E3E3EA;border-radius:999px;padding:0 10px;height:44px;flex:none">
<select aria-label="ભાષા / भाषा / Language" style="appearance:none;border:0;background:transparent;font:inherit;font-size:15px;font-weight:500;color:#1C1F26"><option>ગુજરાતી</option><option>हिंदी</option><option>English</option></select>
<svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 3.5l3 3 3-3" stroke="#1C1F26" stroke-width="1.5" fill="none"/></svg>
</label>
<a href="#" aria-label="ફોન કરો" style="width:44px;height:44px;border-radius:999px;background:#19203F;color:#FFFFFF;display:grid;place-items:center;flex:none"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg></a>
</header>

<main style="padding:36px 0 56px;flex:none">
<div style="padding:0 20px;margin-bottom:20px">
<h1 style="font-size:30px;font-weight:800">ફોટો ગેલેરી</h1>
<p class="mut" style="margin-top:6px">વર્કશૉપથી ખેતર સુધી: અમારા સનેડા, ગામેગામ ડિલિવરી અને સન્માનની ઝલક.</p>
</div>
<div role="group" aria-label="ફોટો ગેલેરી" style="display:flex;gap:8px;overflow:hidden;padding:2px 20px 6px;margin-bottom:16px">
<button class="chip on" aria-pressed="true">બધા</button><button class="chip" aria-pressed="false">સનેડા</button><button class="chip" aria-pressed="false">ટ્રોલી અને ઓજારો</button><button class="chip" aria-pressed="false">ડિલિવરી</button><button class="chip" aria-pressed="false">વર્કશૉપ</button><button class="chip" aria-pressed="false">સન્માન</button>
</div>
<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:0 20px">
<sc-for list="{{items}}" as="g" hint-placeholder-count="24">
<a class="tile" href="{{g.href}}" aria-label="{{g.cap}}" style="background:{{g.bg}}">
<sc-if value="{{g.model}}" hint-placeholder-val="{{false}}"><img src="{{g.img}}" alt="{{g.cap}}" loading="lazy" style="width:86%;display:block"></sc-if>
<sc-if value="{{g.photo}}" hint-placeholder-val="{{false}}"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#8E92A3" stroke-width="1.4" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M4 17l5-4.5 3.5 3 3-2.5L20 17"/></svg><span class="lab">{{g.label}}</span></sc-if>
<sc-if value="{{g.video}}" hint-placeholder-val="{{false}}"><span style="width:48px;height:48px;border-radius:50%;background:#FFFFFF;display:grid;place-items:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="#19203F" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg></span><span style="position:absolute;right:6px;bottom:6px;background:rgba(16,20,44,.85);color:#FFFFFF;font-size:12.5px;padding:0 7px;border-radius:6px;line-height:1.7">{{g.dur}}</span></sc-if>
</a>
</sc-for>
</div>
</main>

<footer style="border-top:1px solid #E3E3EA;padding:26px 20px 110px;flex-grow:1">
<p class="mut" style="font-size:15px">© ૨૦૨૬ દવડા ઍગ્રો ઇન્ડસ્ટ્રીઝ. સર્વ હક સ્વાધીન.</p>
</footer>

<div style="position:absolute;left:0;right:0;bottom:0;background:#FFFFFF;border-top:1px solid #E3E3EA;padding:10px 12px 14px;display:grid;grid-template-columns:1fr 1.4fr;gap:10px">
<a class="btn bg" href="#"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg>ફોન કરો</a>
<a class="btn bw" href="#"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2c-1.5 0-3-.4-4.3-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.4.8 3.2.6.5-.1 1.5-.6 1.7-1.2s.2-1.1.2-1.2-.2-.2-.5-.3z"/></svg>વૉટ્સઍપ પર પૂછો</a>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":2500}}'>
class Component extends DCLogic {
renderVals() {
const IMG = { 'KS-07':'../assets/KS-07.svg', 'KS-10':'../assets/KS-10.svg', 'KS-12':'../assets/KS-12.svg', 'KB-10':'../assets/KB-10.svg', 'KT-15':'../assets/KT-15.svg', 'KC-05':'../assets/KC-05.svg' };
const G = [
['model','KS-12','દવડા બુલેટ ૧૨'],['photo',null,'લાઠીમાં ડિલિવરી','ડિલિવરી · લાઠી'],['model','KS-10','દવડા શક્તિ ૧૦'],['photo',null,'અમારો વર્કશૉપ, ચિતલ','વર્કશૉપ'],
['video',null,'દવડા બુલેટ ૧૨ ખેતરમાં','વિડિયો','૧:૨૪'],['model','KT-15','હાઇડ્રોલિક ટ્રોલી'],['photo',null,'બાબરામાં ડિલિવરી','ડિલિવરી · બાબરા'],['photo',null,'શ્રેષ્ઠ કૃષિ સાધન ઉત્પાદક, ૨૦૨૪','સન્માન'],
['model','KB-10','મિની બુલેટ ટ્રેક્ટર ૧૦'],['video',null,'ડિલિવરીનો દિવસ, અમરેલી','વિડિયો','૦:૫૮'],['model','KS-07','દવડા સાથી ૭'],['photo',null,'સનેડાની ચકાસણી','વર્કશૉપ'],
['model','KC-05','કલ્ટિવેટર'],['photo',null,'ચિતલમાં ડિલિવરી','ડિલિવરી · ચિતલ'],['photo',null,'ખેતરમાં સનેડો','સનેડા'],['photo',null,'ISO 9001:2015 પ્રમાણપત્ર','સન્માન'],
['video',null,'વર્કશૉપની ઝલક','વિડિયો','૨:૧૦'],['photo',null,'અમરેલીમાં ડિલિવરી','ડિલિવરી · અમરેલી'],['model','KS-10','દવડા શક્તિ ૧૦, ટ્રોલી સાથે'],['photo',null,'ટ્રોલીનું હાઇડ્રોલિક ટિપિંગ','ટ્રોલી અને ઓજારો'],
['photo',null,'કૃષિ મેળામાં શ્રેષ્ઠ સ્ટૉલ, ૨૦૨૨','સન્માન'],['photo',null,'લાઠીમાં ડિલિવરી','ડિલિવરી · લાઠી'],['loading',null,'ફોટો લોડ થાય છે'],['loading',null,'ફોટો લોડ થાય છે']
];
const BG = { model:'#F4F4F8', photo:'#ECEDF3', video:'#19203F', loading:'#F4F4F8' };
const items = G.map(([k,id,cap,label,dur]) => ({ model:k==='model', photo:k==='photo', video:k==='video', img:id ? IMG[id] : '', cap, label:label||'', dur:dur||'', bg:BG[k], href: k==='video' ? 'LightboxVideo.dc.html' : 'LightboxMobile.dc.html' }));
return { items };
}
}
</script>
</body>
</html>
