<!doctype html>
<html lang="gu">
<head>

</head>
<body>
<x-dc>

<style>
body{margin:0;background:#F4F4F8;color:#1C1F26;font-family:"Hind Vadodara","Noto Sans Gujarati",system-ui,sans-serif;font-size:16px;line-height:1.6}
*{box-sizing:border-box}
h1,h2,h3{margin:0;font-family:"Anek Gujarati","Hind Vadodara",sans-serif;font-stretch:92%;font-weight:700;line-height:1.25}
p{margin:0}
a{color:inherit}
button{font:inherit;color:inherit}
.hint{font-size:14px;color:#5B6070;line-height:1.5}
.f{display:flex;flex-direction:column;gap:6px}
.fl{font-size:15px;font-weight:600}

.chip.on{background:#19203F;border-color:#19203F;color:#FFFFFF}
.seg{display:flex;background:#F4F4F8;border-radius:10px;padding:4px;gap:4px}
.seg button{flex:1;height:38px;border:0;border-radius:8px;background:transparent;font-weight:500;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;font-size:15px}

<div style="width:360px;height:1060px;background:#F4F4F8;display:flex;flex-direction:column;position:relative;overflow:hidden">

<h1 style="font-size:19px;margin-right:auto">ફોટાની વિગત</h1>
<span class="hint" style="padding-right:10px">૬ / ૨૪</span>
</header>

<div style="height:270px;background:#FFFFFF;display:grid;place-items:center;border-bottom:1px solid #E3E3EA;flex:none;position:relative">

<span style="position:absolute;left:12px;top:10px;font-size:11px;color:#5B6070;font-family:Hind,sans-serif;letter-spacing:.04em">PHOTO PLACEHOLDER</span>
</div>

<main style="padding:20px 16px 110px;display:flex;flex-direction:column;gap:22px">
<div class="f"><span class="fl">વિભાગ</span>
<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="chip on" aria-pressed="true">સનેડા</button><button class="chip" aria-pressed="false">ટ્રોલી અને ઓજારો</button><button class="chip" aria-pressed="false">ડિલિવરી</button><button class="chip" aria-pressed="false">વર્કશૉપ</button><button class="chip" aria-pressed="false">સન્માન</button></div>
</div>

<div class="f"><span class="fl">કૅપ્શન</span>
<div class="seg" role="tablist" aria-label="ભાષા">
<button role="tab" aria-selected="false"><span class="ok"></span>ગુજરાતી</button>
<button role="tab" aria-selected="false" style="font-family:Hind,sans-serif"><span class="ok"></span>हिंदी</button>
<button class="on" role="tab" aria-selected="true" style="font-family:Hind,sans-serif"><span class="miss"></span>English</button>
</div>
<div class="inp" style="border-color:#19203F;box-shadow:0 0 0 3px rgba(224,123,22,.45);font-family:Hind,sans-serif">Davada Shakti 10<span style="width:1.5px;height:20px;background:#19203F"></span></div>
<span class="hint">ગુજરાતી: દવડા શક્તિ ૧૦ · ટૂંકું રાખો. ડિલિવરીના ફોટામાં ગામનું નામ લખો, જેમ કે “લાઠીમાં ડિલિવરી”.</span>
</div>

<div class="f"><label class="fl">ફોટામાં કયું મોડેલ છે? <span class="hint" style="font-weight:400">(જરૂરી નથી)</span></label>
<div class="inp" style="justify-content:space-between"><span>દવડા શક્તિ ૧૦ <span style="color:#5B6070;font-family:Hind,sans-serif">· KS-10</span></span><svg width="14" height="14" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 3.5l3 3 3-3" stroke="#1C1F26" stroke-width="1.5" fill="none"/></svg></div>
<span class="hint">પસંદ કરશો તો ગેલેરીમાં “આ મોડેલ વિશે પૂછો” બટન દેખાશે.</span>
</div>

<div style="display:flex;flex-direction:column;gap:4px;border-top:1px solid #E3E3EA;padding-top:14px">
<button class="btn" style="background:transparent;justify-content:flex-start;padding:0 4px;gap:10px;color:#1C1F26"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>ફોટાની લિંક કૉપી કરો</button>
<button class="btn" style="background:transparent;justify-content:flex-start;padding:0 4px;gap:10px;color:#B3261E"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>આ ફોટો કાઢી નાખો</button>
</div>
</main>

<div style="position:absolute;left:0;right:0;bottom:0;background:#FFFFFF;border-top:1px solid #E3E3EA;padding:10px 12px 14px;display:flex;align-items:center;gap:10px">
<span style="flex-grow:1;font-weight:500;font-size:15px">ફેરફાર હજી સાચવ્યા નથી</span>
<button class="btn bg">રદ કરો</button>
<button class="btn bk">સાચવો</button>
</div>

</div>
