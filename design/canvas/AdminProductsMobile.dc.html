<!doctype html>
<html lang="gu">
<head>
<meta charset="utf-8">
<title>ઍડમિન — સનેડા (મોબાઇલ)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anek+Gujarati:wdth,wght@75..125,500..800&amp;family=Hind+Vadodara:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#F4F4F8;color:#1C1F26;font-family:"Hind Vadodara","Noto Sans Gujarati",system-ui,sans-serif;font-size:16px;line-height:1.6}
*{box-sizing:border-box}
h1,h2,h3{margin:0;font-family:"Anek Gujarati","Hind Vadodara",sans-serif;font-stretch:92%;font-weight:700;line-height:1.25}
p{margin:0}
a{color:inherit}
button{font:inherit;color:inherit}
.hint{font-size:14px;color:#5B6070;line-height:1.5}
.card{background:#FFFFFF;border:1px solid #E3E3EA;border-radius:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 20px;border-radius:12px;font-weight:600;font-size:17px;text-decoration:none;border:0;cursor:pointer;white-space:nowrap}
.btn svg{width:20px;height:20px;flex:none}
.bk{background:#E07B16;color:#1B1206}
.sw{width:46px;height:28px;border-radius:999px;border:0;padding:3px;background:#C9CBDD;display:flex;cursor:pointer;flex:none}
.sw span{width:22px;height:22px;border-radius:50%;background:#FFFFFF}
.sw.on{background:#19203F;justify-content:flex-end}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-decoration:none;color:#5B6070;font-size:13px}
</style>
</helmet>
<div style="width:360px;height:800px;background:#F4F4F8;display:flex;flex-direction:column;position:relative;overflow:hidden">

<header style="height:56px;background:#FFFFFF;border-bottom:1px solid #E3E3EA;display:flex;align-items:center;padding:0 16px;flex:none">
<h1 style="font-size:20px;margin-right:auto">સનેડા <span class="hint" style="font-weight:400">· ૬</span></h1>
</header>

<main style="padding:16px 16px 100px;display:flex;flex-direction:column;gap:12px">
<a class="btn bk" href="AdminProductEditMobile.dc.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>નવો સનેડો ઉમેરો</a>
<p class="hint" style="padding:0 4px">ક્રમ બદલવા ⠿ પકડીને ઉપર-નીચે ખસેડો. સાઇટ પર આ જ ક્રમમાં દેખાશે.</p>
<div class="card">
<sc-for list="{{items}}" as="p" hint-placeholder-count="6">
<div style="display:flex;align-items:center;gap:8px;padding:8px 12px 8px 4px;border-bottom:{{p.border}}">
<button aria-label="ક્રમ બદલો" style="width:32px;height:44px;border:0;background:none;display:grid;place-items:center;cursor:grab;flex:none"><svg width="18" height="18" viewBox="0 0 24 24" fill="#8E92A3" aria-hidden="true"><circle cx="9" cy="6" r="1.5"/><circle cx="15" cy="6" r="1.5"/><circle cx="9" cy="12" r="1.5"/><circle cx="15" cy="12" r="1.5"/><circle cx="9" cy="18" r="1.5"/><circle cx="15" cy="18" r="1.5"/></svg></button>
<a href="AdminProductEditMobile.dc.html" style="display:flex;align-items:center;gap:12px;flex-grow:1;min-width:0;text-decoration:none">
<span style="width:52px;height:52px;border-radius:10px;background:#F4F4F8;display:grid;place-items:center;flex:none"><img src="{{p.img}}" alt="" style="width:46px"></span>
<span style="display:flex;flex-direction:column;min-width:0">
<span style="font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{p.name}}</span>
<span class="hint">{{p.price}}</span>
<sc-if value="{{p.miss}}" hint-placeholder-val="{{false}}"><span style="font-size:13px;color:#B85E08;display:flex;align-items:center;gap:6px"><span style="width:7px;height:7px;border-radius:50%;border:1.5px solid #B85E08"></span>હિન્દી બાકી</span></sc-if>
</span>
</a>
<div style="display:flex;flex-direction:column;align-items:center;gap:2px;flex:none">
<button class="{{p.sw}}" role="switch" aria-checked="{{p.stock}}" aria-label="{{p.name}}: સ્ટૉકમાં"><span></span></button>
<span style="font-size:12px;color:#5B6070">સ્ટૉક</span>
</div>
</div>
</sc-for>
</div>
</main>

<div style="position:absolute;left:12px;right:12px;bottom:80px;background:#19203F;color:#FFFFFF;border-radius:12px;padding:8px 8px 8px 14px;display:flex;align-items:center;gap:10px">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F4A94E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
<span style="flex-grow:1;font-size:15px">મિની બુલેટ ટ્રેક્ટર ૧૦: ઑર્ડર પર તૈયાર</span>
<button style="height:44px;padding:0 12px;border:0;border-radius:8px;background:rgba(255,255,255,.12);color:#FFFFFF;font-weight:600;cursor:pointer">પાછું લો</button>
</div>

<nav aria-label="ઍડમિન" style="position:absolute;left:0;right:0;bottom:0;height:68px;background:#FFFFFF;border-top:1px solid #E3E3EA;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding-bottom:4px">
<a href="AdminHomeMobile.dc.html" class="tab"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>મુખ્ય</a>
<a href="#" class="tab" aria-current="page" style="color:#19203F;font-weight:600"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" aria-hidden="true"><circle cx="7" cy="16.5" r="3"/><circle cx="17.5" cy="17.5" r="2"/><path d="M7 13.5V8h5l2.5 6H20v3.5M10 8V5"/></svg>સનેડા</a>
<a href="AdminGalleryMobile.dc.html" class="tab"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M4 17l5-4.5 3.5 3 3-2.5L20 17"/></svg>ગેલેરી</a>
<a href="#" class="tab"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5.5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="18.5" cy="12" r="1.8"/></svg>વધુ</a>
</nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":800}}'>
class Component extends DCLogic {
renderVals() {
const R = (name, img, price, stock, miss, last) => ({ name, img, price, stock, miss, sw: stock ? 'sw on' : 'sw', border: last ? '0' : '1px solid #E3E3EA' });
return { items: [
R('દવડા સાથી ૭', '../assets/KS-07.svg', '₹૧,૩૫,૦૦૦', true, false),
R('દવડા શક્તિ ૧૦', '../assets/KS-10.svg', '₹૧,૬૫,૦૦૦', true, false),
R('દવડા બુલેટ ૧૨', '../assets/KS-12.svg', '₹૧,૯૫,૦૦૦', true, true),
R('મિની બુલેટ ટ્રેક્ટર ૧૦', '../assets/KB-10.svg', '₹૨,૨૫,૦૦૦', false, false),
R('હાઇડ્રોલિક ટ્રોલી', '../assets/KT-15.svg', '₹૪૫,૦૦૦', true, true),
R('કલ્ટિવેટર', '../assets/KC-05.svg', 'કિંમત માટે પૂછો', true, false, true)
] };
}
}
</script>
</body>
</html>
