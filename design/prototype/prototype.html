<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>દવડા ઍગ્રો ઇન્ડસ્ટ્રીઝ – ચિતલ, અમરેલી</title>
<meta name="description" content="ચિતલથી સૌરાષ્ટ્રના ખેડૂતો માટે મજબૂત અને ટકાઉ સનેડા. વૉટ્સઍપ પર સીધી પૂછપરછ કરો.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anek+Gujarati:wdth,wght@75..125,500..800&family=Anek+Devanagari:wdth,wght@75..125,500..800&family=Anek+Latin:wdth,wght@75..125,500..800&family=Hind+Vadodara:wght@400;500;600&family=Hind:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --night:#19203F; --night-deep:#10142C; --kesar:#E07B16; --kesar-deep:#B85E08; --kesar-soft:#FCEBD6;
  --ink:#1C1F26; --muted:#5B6070; --paper:#FFFFFF; --wash:#F4F4F8; --line:#E3E3EA;
  --wa:#1DA851; --wa-dark:#12873F;
  --display:"Anek Gujarati","Hind Vadodara","Noto Sans Gujarati",sans-serif;
  --body:"Hind Vadodara","Noto Sans Gujarati",system-ui,sans-serif;
  --lh:1.7;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[lang="hi"]{--display:"Anek Devanagari","Hind","Noto Sans Devanagari",sans-serif;--body:"Hind","Noto Sans Devanagari",system-ui,sans-serif;--lh:1.7}
:root[lang="en"]{--display:"Anek Latin","Hind",system-ui,sans-serif;--body:"Hind",system-ui,sans-serif;--lh:1.6}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--ink:#ECEDF2;--muted:#A6AABA;--paper:#12141C;--wash:#1B1E29;--line:#2B2F3D;--kesar-soft:#35261A}
}
:root[data-theme="dark"]{--ink:#ECEDF2;--muted:#A6AABA;--paper:#12141C;--wash:#1B1E29;--line:#2B2F3D;--kesar-soft:#35261A}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:1.0625rem;line-height:var(--lh)}
img,svg{max-width:100%;display:block}
h1,h2,h3{font-family:var(--display);font-stretch:92%;margin:0;line-height:1.25;font-weight:700}
p{margin:0}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--kesar);outline-offset:3px;border-radius:6px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
.wrap{max-width:1160px;margin:0 auto;padding:0 20px}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;height:64px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;margin-right:auto;min-width:0}
.brand svg{width:34px;height:34px;flex:none}
.brand b{display:block;font-family:var(--display);font-weight:800;font-size:1.2rem;line-height:1.1;white-space:nowrap}
.brand small{display:block;font-size:.8rem;color:var(--muted);line-height:1.2;white-space:nowrap}
.nav{display:none;gap:22px}
.nav a{text-decoration:none;font-weight:500;color:var(--muted)}
.nav a:hover{color:var(--ink)}
.lang{position:relative;display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:0 12px;height:40px;color:var(--ink)}
.lang svg{width:18px;height:18px;flex:none;color:var(--muted)}
.lang select{appearance:none;-webkit-appearance:none;border:0;background:transparent;font:inherit;font-weight:500;color:inherit;padding-right:14px;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:right 4px center,right 0 center;background-size:4px 4px;background-repeat:no-repeat}
.callbtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;min-width:40px;border-radius:999px;background:var(--night);color:#fff;text-decoration:none;font-weight:600;padding:0 10px}
.callbtn svg{width:18px;height:18px}
.callbtn span{display:none}
.brand>span{min-width:0}
.brand b{overflow:hidden;text-overflow:ellipsis}
@media (max-width:480px){.top .wrap{gap:8px;padding:0 14px}.brand b{font-size:.98rem;font-stretch:82%}.brand svg{width:30px;height:30px}.lang{padding:0 10px}.lang svg{display:none}}
@media (min-width:900px){.nav{display:flex}.callbtn{padding:0 16px}.callbtn span{display:inline}}

/* Hero */
.hero{position:relative;overflow:hidden;color:#fff;
  background:linear-gradient(180deg,#141A3A 0%,#1E2750 100%)}
.hero-inner{position:relative;z-index:2;padding-top:40px;padding-bottom:calc(75vw - 30px)}
.bless{font-family:var(--display);font-size:1rem;letter-spacing:.02em;color:#F7C98A;margin-bottom:14px}
.hero h1{font-size:clamp(2.1rem,7vw,3.7rem);font-weight:800;max-width:14ch;line-height:1.2}
.hero h1,.hero p.lead,.bless{text-shadow:0 1px 12px rgba(10,14,34,.5)}
.hero p.lead{margin-top:16px;max-width:36ch;font-size:1.125rem;color:#E4E4F2}
.hero .cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 22px;border-radius:14px;font-weight:600;font-size:1.05rem;text-decoration:none;border:0;cursor:pointer}
.btn svg{width:22px;height:22px;flex:none}
.btn-kesar{background:var(--kesar);color:#1B1206}
.btn-kesar:hover{background:#EE8A25}
.btn-wa{background:var(--wa);color:#fff}
.btn-wa:hover{background:var(--wa-dark)}
.btn-ghost{background:transparent;color:inherit;border:1.5px solid var(--line)}
.hero .btn-ghost{border-color:rgba(255,255,255,.4);color:#fff}
.temple-photo{position:absolute;z-index:1;left:0;right:0;bottom:0;width:100%;height:auto;object-fit:cover;object-position:center 70%;
  -webkit-mask-image:linear-gradient(180deg,transparent 0%,#000 32%);mask-image:linear-gradient(180deg,transparent 0%,#000 32%)}
.temple{position:absolute;z-index:1;left:50%;bottom:36px;transform:translateX(-50%);width:min(560px,118vw)}
.ground{position:absolute;left:0;right:0;bottom:0;height:40px;background:var(--night-deep);z-index:1}
@media (min-width:900px){
  .hero-inner{padding-top:88px}
  .hero-inner{padding-bottom:120px;min-height:600px}
  .temple-photo{left:auto;right:0;top:0;width:min(62%,900px);height:100%;object-position:center 60%;
    -webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 30%);mask-image:linear-gradient(90deg,transparent 0%,#000 30%)}
}

/* Stats */
.stats{background:var(--night-deep);color:#fff}
.stats ul{list-style:none;margin:0;padding:22px 0 30px;display:grid;grid-template-columns:1fr 1fr;gap:18px 20px}
.stats b{display:block;font-family:var(--display);font-size:2rem;font-weight:800;color:#F4A94E;line-height:1.2}
.stats span{color:#C9CBDD;font-size:.95rem}
@media (min-width:760px){.stats ul{grid-template-columns:repeat(4,1fr)}}

/* Sections */
section.block{padding:64px 0}
.head{max-width:620px;margin-bottom:26px}
.head h2{font-size:clamp(1.7rem,4.5vw,2.4rem)}
.head p{margin-top:8px;color:var(--muted)}

/* Filters */
.filters{display:flex;gap:8px;overflow-x:auto;padding:2px 20px 6px;margin:0 -20px 22px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{flex:none;height:42px;padding:0 18px;border-radius:999px;border:1.5px solid var(--line);background:var(--paper);font-weight:500;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--night);border-color:var(--night);color:#fff}

/* Cards */
.grid{display:grid;gap:18px;grid-template-columns:1fr}
@media (min-width:640px){.grid{grid-template-columns:1fr 1fr}}
@media (min-width:1000px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--paper)}
.pic{position:relative;display:block;width:100%;border:0;padding:18px 18px 8px;background:var(--wash);cursor:pointer;color:var(--ink)}
.pic svg{width:100%;height:auto;aspect-ratio:16/10}
.tag{position:absolute;top:12px;left:12px;background:var(--kesar);color:#1B1206;font-size:.82rem;font-weight:600;padding:3px 10px;border-radius:8px}
.stock{position:absolute;top:12px;right:12px;font-size:.82rem;font-weight:500;padding:3px 10px;border-radius:8px;background:var(--paper);color:var(--muted)}
.stock.in::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--wa);margin-right:6px;vertical-align:middle}
.card .body{padding:18px 18px 20px;display:flex;flex-direction:column;gap:12px;flex:1}
.card h3{font-size:1.45rem}
.card .desc{color:var(--muted);font-size:.98rem}
.mini{display:flex;gap:24px}
.mini div{display:flex;flex-direction:column}
.mini dt{font-size:.85rem;color:var(--muted)}
.mini dd{margin:0;font-weight:600}
.price{margin-top:auto;padding-top:12px;border-top:1px dashed var(--line)}
.price small{display:block;font-size:.85rem;color:var(--muted)}
.price b{font-family:var(--display);font-size:1.6rem;font-weight:800}
.price b.ask{font-size:1.2rem}
.actions{display:flex;flex-direction:column;gap:8px}
.actions .btn{width:100%}
.linkbtn{background:none;border:0;padding:10px;font-weight:600;color:var(--ink);text-decoration:underline;text-underline-offset:4px;cursor:pointer;min-height:44px}

/* Subsidy */
.subsidy{background:var(--kesar-soft);border-radius:24px;padding:32px 22px;display:grid;gap:28px}
.subsidy h2{font-size:clamp(1.6rem,4.2vw,2.2rem)}
.subsidy .main p{margin-top:12px;max-width:52ch}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:14px;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:14px;align-items:flex-start;font-weight:500}
.steps li::before{content:counter(s);flex:none;width:34px;height:34px;border-radius:50%;background:var(--kesar);color:#1B1206;font-family:var(--display);font-weight:800;display:grid;place-items:center;line-height:1}
:root[lang="gu"] .steps li::before{content:counter(s,gujarati)}
:root[lang="hi"] .steps li::before{content:counter(s,devanagari)}
.note{font-size:.9rem;color:var(--muted);margin-top:14px}
@media (min-width:900px){.subsidy{grid-template-columns:1.1fr 1fr;padding:48px;align-items:start}}

/* Awards */
.awards{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 20px 12px;margin:0 -20px;scrollbar-width:thin}
.award{flex:none;width:250px;scroll-snap-align:start;border:1px solid var(--line);border-radius:18px;padding:22px;background:var(--paper);display:flex;flex-direction:column;gap:10px}
.award svg{width:44px;height:44px;color:var(--kesar)}
.award .yr{font-family:var(--display);font-weight:800;font-size:1.1rem;color:var(--kesar-deep)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .award .yr{color:var(--kesar)}}
.award h3{font-size:1.15rem}
.award p{font-size:.92rem;color:var(--muted)}

/* Reviews */
.reviews{display:grid;gap:16px}
@media (min-width:900px){.reviews{grid-template-columns:repeat(3,1fr)}}
.review{margin:0;padding:24px;border-radius:18px;background:var(--wash);display:flex;flex-direction:column;gap:16px}
.review blockquote{margin:0;font-size:1.05rem}
.review figcaption b{display:block}
.review figcaption span{color:var(--muted);font-size:.92rem}

/* Visit */
.visit{display:grid;gap:24px}
.visit dl{margin:0;display:grid;gap:16px}
.visit dt{font-size:.9rem;color:var(--muted)}
.visit dd{margin:0;font-weight:500}
.visit .acts{display:flex;flex-wrap:wrap;gap:10px}
@media (min-width:900px){.visit{grid-template-columns:1fr 1fr;align-items:start}}

footer{border-top:1px solid var(--line);padding:26px 0 40px;color:var(--muted);font-size:.9rem}

/* Sticky mobile bar */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--paper);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:1fr 1.4fr;gap:10px;transform:translateY(110%);transition:transform .25s ease}
.dock.show{transform:none}
.dock .btn{min-height:48px;border-radius:12px}
body{padding-bottom:0}
@media (max-width:899px){footer{padding-bottom:110px}}
@media (min-width:900px){.dock{display:none}}

/* Detail sheet */
dialog.sheet{border:0;padding:0;margin:auto auto 0;width:100%;max-width:100%;max-height:92vh;border-radius:22px 22px 0 0;background:var(--paper);color:var(--ink)}
dialog.sheet::backdrop{background:rgba(10,12,24,.55)}
dialog.sheet[open]{animation:up .25s ease}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.sheet .scroll{overflow-y:auto;max-height:92vh;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 8px)}
.sheet .pic{cursor:default;padding:28px 28px 12px}
.sheet .x{position:absolute;top:12px;right:12px;z-index:2;width:44px;height:44px;border-radius:50%;border:0;background:var(--paper);display:grid;place-items:center;cursor:pointer;box-shadow:0 1px 0 var(--line)}
.sheet .x svg{width:20px;height:20px}
.sheet .grab{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:40px;height:4px;border-radius:4px;background:var(--line);z-index:2}
.sheet .inner{padding:20px 22px 22px;display:grid;gap:16px}
.sheet h3{font-size:1.8rem}
.specs{margin:0;display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.specs div{padding:12px 14px;border-bottom:1px solid var(--line)}
.specs div:nth-child(odd){border-right:1px solid var(--line)}
.specs div:nth-last-child(-n+2){border-bottom:0}
.specs dt{font-size:.85rem;color:var(--muted)}
.specs dd{margin:0;font-weight:600}
.sheet .actions{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:700px){
  dialog.sheet{margin:auto;max-width:640px;border-radius:22px}
  .sheet .actions{grid-template-columns:1.5fr 1fr}
  .sheet .grab{display:none}
}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <a class="brand" href="#top" aria-label="">
      <svg viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="10" fill="#19203F"/><path d="M13 32c0-7 3-13 6-17h2c3 4 6 10 6 17z" fill="#E07B16"/><ellipse cx="20" cy="14.5" rx="3" ry="1.2" fill="#E07B16"/><path d="M20 13V6l6 1.6L20 9" fill="#F4A94E" stroke="#F4A94E" stroke-width=".6"/></svg>
      <span><b data-i18n="brandName"></b><small data-i18n="brandPlace"></small></span>
    </a>
    <nav class="nav">
      <a href="#sanedo" data-i18n="navProducts"></a>
      <a href="#sahay" data-i18n="navSubsidy"></a>
      <a href="#siddhi" data-i18n="navAwards"></a>
      <a href="#sampark" data-i18n="navContact"></a>
    </nav>
    <label class="lang">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/></svg>
      <select id="langSel" aria-label="ભાષા / भाषा / Language">
        <option value="gu" lang="gu">ગુજરાતી</option>
        <option value="hi" lang="hi">हिंदी</option>
        <option value="en" lang="en">English</option>
      </select>
    </label>
    <a class="callbtn" data-tel data-i18n-aria="call"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg><span data-i18n="call"></span></a>
  </div>
</header>

<main id="top">
  <section class="hero" aria-labelledby="heroTitle">
    <div class="wrap hero-inner">
      <p class="bless" data-i18n="blessing"></p>
      <h1 id="heroTitle" data-i18n="heroTitle"></h1>
      <p class="lead" data-i18n="heroSub"></p>
      <div class="cta">
        <a class="btn btn-kesar" href="#sanedo" data-i18n="heroCta"></a>
        <a class="btn btn-ghost" data-wa="general" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><use href="#i-wa"/></svg><span data-i18n="askWa"></span></a>

  hi:["मूँगफली के सीज़न में यार्ड तक माल ले जाने में बहुत काम आता है। डीज़ल भी कम खाता है।","भरतभाई सोजित्रा","बाबरा"],
  en:["In groundnut season it carries our crop to the market yard, and it's easy on diesel.","Bharatbhai Sojitra","Babra"]},
 {gu:["સહાયનું ફોર્મ ભરવામાં પણ એમણે પૂરી મદદ કરી. ભરોસાપાત્ર વેપારી છે.","મનસુખભાઈ ડોબરિયા","અમરેલી"],
  hi:["सहायता का फ़ॉर्म भरने में भी उन्होंने पूरी मदद की। भरोसेमंद व्यापारी हैं।","मनसुखभाई डोबरिया","अमरेली"],
  en:["They even helped us fill in the subsidy form. A dealer you can trust.","Mansukhbhai Dobariya","Amreli"]}
];

const STATS = [["12+","statYears"],["3,200+","statSold"],["450+","statVillages"],["12","statAwards"]];

/* ===== Helpers ===== */
let lang = "gu", filter = "all";
try { const q = new URLSearchParams(location.search).get("lang"); const s = localStorage.getItem("de-lang"); lang = [q,s].find(v=>v&&T[v]) || "gu"; } catch(e){}
const t = k => T[lang][k] ?? T.gu[k];
const GU = "૦૧૨૩૪૫૬૭૮૯";
const num = v => lang==="gu" ? String(v).replace(/[0-9]/g,d=>GU[d]) : String(v);
const money = p => p==null ? null : num("₹" + new Intl.NumberFormat("en-IN").format(p));
const fullName = p => p.hp ? `${p.name[lang]} ${num(p.hp)}` : p.name[lang];
const link = p => `${BIZ.site}/#p-${p.id}`;
const waURL = (text, to=BIZ.whatsapp) => `https://wa.me/${to}?text=${encodeURIComponent(text)}`;
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const WA_ICON = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><use href="#i-wa"/></svg>';
const PHONE_ICON = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg>';

function art(p){
  const c=p.color, tyre="#23252B", hub="#9AA0AA", dark="#2A2C31", steel="#6B707A";
  if(p.art==="trolley") return `<svg viewBox="0 0 320 200" role="img" aria-label="${esc(p.name[lang])}"><ellipse cx="170" cy="186" rx="120" ry="7" fill="currentColor" opacity=".08"/><path d="M20 128h70" stroke="${steel}" stroke-width="6" stroke-linecap="round"/><circle cx="20" cy="128" r="6" fill="${dark}"/><g transform="rotate(-8 90 126)"><rect x="80" y="70" width="210" height="58" rx="4" fill="${c}"/><rect x="80" y="70" width="210" height="9" fill="#000" opacity=".18"/><path d="M122 80v44M164 80v44M206 80v44M248 80v44" stroke="#000" opacity=".14" stroke-width="3"/></g><path d="M200 140l-8-40" stroke="${steel}" stroke-width="7"/><path d="M160 150a36 36 0 0 1 72 0" stroke="${c}" stroke-width="7" fill="none"/><circle cx="196" cy="154" r="28" fill="${tyre}"/><circle cx="196" cy="154" r="28" fill="none" stroke="#3A3D45" stroke-width="5" stroke-dasharray="5 4"/><circle cx="196" cy="154" r="11" fill="${hub}"/></svg>`;
  if(p.art==="cult") return `<svg viewBox="0 0 320 200" role="img" aria-label="${esc(p.name[lang])}"><ellipse cx="160" cy="186" rx="120" ry="7" fill="currentColor" opacity=".08"/><rect x="50" y="78" width="220" height="16" rx="3" fill="${c}"/><rect x="70" y="108" width="180" height="12" rx="3" fill="${c}" opacity=".85"/><path d="M150 78l-10-30h40l-10 30" fill="${steel}"/>${[70,110,150,190,230,90,130,170,210,250].map((x,i)=>`<path d="M${x} ${i<5?94:120}v${i<5?44:34}q0 14 12 20" stroke="${dark}" stroke-width="6" fill="none" stroke-linecap="round"/>`).join("")}</svg>`;
  const four = p.art==="four", bullet = p.art==="bullet";
  return `<svg viewBox="0 0 320 200" role="img" aria-label="${esc(fullName(p))}">
  <ellipse cx="160" cy="186" rx="134" ry="7" fill="currentColor" opacity=".08"/>
  <rect x="176" y="84" width="128" height="42" rx="3" fill="${c}"/><rect x="176" y="84" width="128" height="9" fill="#000" opacity=".18"/>
  <path d="M204 94v30M232 94v30M260 94v30M288 94v30" stroke="#000" opacity=".13" stroke-width="3"/>
  <path d="M198 152a38 38 0 0 1 76 0" stroke="${c}" stroke-width="8" fill="none"/>
  <circle cx="236" cy="154" r="30" fill="${tyre}"/><circle cx="236" cy="154" r="30" fill="none" stroke="#3A3D45" stroke-width="6" stroke-dasharray="5 4"/><circle cx="236" cy="154" r="12" fill="${hub}"/><circle cx="236" cy="154" r="4" fill="#555"/>
  <path d="M90 120l86-4v14l-78 6z" fill="${c}"/>
  <rect x="112" y="118" width="54" height="32" rx="4" fill="${steel}"/><path d="M118 125h42M118 131h42M118 137h42M118 143h42" stroke="#4A4E57" stroke-width="2"/>
  <path d="M104 98q8-14 42-12l14 6-2 12-52 2z" fill="${bullet?"#2B2F3A":c}"/>${bullet?'<path d="M112 96q10-8 32-7" stroke="#D9DCE2" stroke-width="3" fill="none"/>':""}
  <rect x="150" y="96" width="36" height="10" rx="5" fill="${dark}"/>
  ${four?`<path d="M46 124l58-10 6 30-64 6z" fill="${c}"/><path d="M52 124l44-7" stroke="#000" opacity=".18" stroke-width="3"/>`:""}
  <path d="M${four?76:72} 160L96 76" stroke="#8A9099" stroke-width="6" stroke-linecap="round"/>
  <path d="M84 70q14-4 28 2" stroke="${dark}" stroke-width="5" fill="none" stroke-linecap="round"/>
  <circle cx="96" cy="88" r="8" fill="#F4D58D" stroke="${dark}" stroke-width="3"/>
  <path d="M${four?46:50} 150a${four?28:24} ${four?28:24} 0 0 1 ${four?56:44} 0" stroke="${c}" stroke-width="6" fill="none"/>
  <circle cx="${four?74:72}" cy="${four?158:162}" r="${four?26:22}" fill="${tyre}"/><circle cx="${four?74:72}" cy="${four?158:162}" r="9" fill="${hub}"/>
</svg>`;
}

function specs(p){
  const rows=[];
  if(p.hp){
    rows.push([t("specPower"),`${num(p.hp)} HP`],[t("specGears"),num(t("gears")(p.gears[0],p.gears[1]))],
      [t("specLoad"),`${num(p.load)} ${t("ton")}`],[t("specTank"),`${num(p.tank)} ${t("litre")}`],
      [t("specStart"),t(p.start)],[t("specWarranty"),`${num(p.warranty)} ${t("year")}`]);
  } else {
    if(p.load) rows.push([t("specLoad"),`${num(p.load)} ${t("ton")}`]);
    if(p.width) rows.push([t("specWidth"),`${num(p.width)} ${t("feet")}`]);
    if(p.tipping) rows.push([t("specTipping"),t("hydraulic")]);
    rows.push([t("specFits"),t("fitsAll")],[t("specWarranty"),`${num(p.warranty)} ${t("year")}`]);
    if(rows.length%2) rows.push(["",""]);
  }
  return rows;
}

function enquireLink(p){ return waURL(t("waProduct")(fullName(p), p.id, money(p.price) || t("askPrice"), link(p))); }

function priceHTML(p){
  return p.price==null ? `<small>&nbsp;</small><b class="ask">${t("askPrice")}</b>`
                       : `<small>${t("exShowroom")}</small><b>${money(p.price)}</b>`;
}

/* ===== Render ===== */
function renderStatic(){
  document.documentElement.lang = lang;
  document.title = `${t("brandName")} – ${t("brandPlace")}`;
  document.querySelectorAll("[data-i18n]").forEach(el=>{ el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll("[data-i18n-alt]").forEach(el=>el.alt=t(el.dataset.i18nAlt));
  document.querySelectorAll("[data-i18n-aria]").forEach(el=>el.setAttribute("aria-label", t(el.dataset.i18nAria)));
  document.querySelector(".brand").setAttribute("aria-label", t("brandName"));
  document.querySelectorAll("[data-tel]").forEach(a=>a.href="tel:"+BIZ.phone);
  document.querySelectorAll("[data-tel-text]").forEach(a=>a.textContent=BIZ.phone.replace(/^\+91/,"+91 ").replace(/(\d{5})(\d{5})$/,"$1 $2"));
  document.querySelectorAll("[data-wa]").forEach(a=>a.href=waURL(T[lang].wa[a.dataset.wa]));
  document.getElementById("mapLink").href = BIZ.maps;
  document.getElementById("langSel").value = lang;

  document.getElementById("stats").innerHTML = STATS.map(([v,k])=>`<li><b>${num(v)}</b><span>${t(k)}</span></li>`).join("");

  const F=[["all","fAll"],["3","f3"],["4","f4"],["impl","fImpl"]];
  const fl=document.getElementById("filters");
  fl.setAttribute("aria-label", t("navProducts"));
  fl.innerHTML = F.map(([v,k])=>`<button class="chip" data-f="${v}" aria-pressed="${v===filter}">${t(k)}</button>`).join("");

  const icons={trophy:'<path d="M7 4h10v4a5 5 0 0 1-10 0zM7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4M12 13v4M8 21h8M9 17h6v4H9z"/>',
    medal:'<circle cx="12" cy="15" r="5"/><path d="M8.5 11 6 3h4l2 5 2-5h4l-2.5 8M12 13v4"/>',
    cert:'<rect x="3" y="4" width="18" height="13" rx="2"/><path d="M7 9h10M7 12h6M16 17v4l2-1.3 2 1.3v-4"/>'};
  document.getElementById("awards").innerHTML = AWARDS.map(a=>`<article class="award"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true">${icons[a.i]}</svg><span class="yr">${num(a.y)}</span><h3>${a[lang][0]}</h3><p>${a[lang][1]}</p></article>`).join("");

  document.getElementById("reviews").innerHTML = REVIEWS.map(r=>`<figure class="review"><blockquote>${r[lang][0]}</blockquote><figcaption><b>${r[lang][1]}</b><span>${r[lang][2]}</span></figcaption></figure>`).join("");
}

function renderGrid(){
  const list = P.filter(p=>filter==="all"||p.cat===filter);
  document.getElementById("grid").innerHTML = list.map(p=>{
    const s=specs(p).slice(0,2);
    return `<article class="card">
      <button class="pic" data-open="${p.id}" aria-label="${esc(t("details"))}: ${esc(fullName(p))}">
        ${p.best?`<span class="tag">${t("bestSeller")}</span>`:""}
        <span class="stock ${p.stock?"in":""}">${p.stock?t("inStock"):t("toOrder")}</span>
        ${art(p)}
      </button>
      <div class="body">
        <h3>${fullName(p)}</h3>
        <p class="desc">${p.desc[lang]}</p>
        <dl class="mini">${s.map(([k,v])=>`<div><dt>${k}</dt><dd>${v}</dd></div>`).join("")}</dl>
        <div class="price">${priceHTML(p)}</div>
        <div class="actions">
          <a class="btn btn-wa" href="${enquireLink(p)}" target="_blank" rel="noopener">${WA_ICON}<span>${t("enquire")}</span></a>
          <button class="linkbtn" data-open="${p.id}">${t("details")}</button>
        </div>
      </div>
    </article>`;
  }).join("");
}

/* ===== Detail sheet ===== */
const sheet=document.getElementById("sheet"); let current=null, pushed=false;
function renderSheet(){
  const p=current; if(!p) return;
  document.getElementById("sheetBody").innerHTML = `
    <span class="grab" aria-hidden="true"></span>
    <button class="x" data-close aria-label="${t("close")}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    <div class="pic" style="position:relative">${p.best?`<span class="tag">${t("bestSeller")}</span>`:""}${art(p)}</div>
    <div class="inner">
      <div><span class="stock ${p.stock?"in":""}" style="position:static;padding:0;background:none">${p.stock?t("inStock"):t("toOrder")}</span>
      <h3 id="sheetTitle">${fullName(p)}</h3><p class="desc" style="color:var(--muted);margin-top:6px">${p.desc[lang]}</p></div>
      <div class="price" style="border:0;padding:0">${priceHTML(p)}</div>
      <dl class="specs">${specs(p).map(([k,v])=>`<div><dt>${k}</dt><dd>${v}</dd></div>`).join("")}</dl>
      <div class="actions">
        <a class="btn btn-wa" href="${enquireLink(p)}" target="_blank" rel="noopener">${WA_ICON}<span>${t("enquire")}</span></a>
        <a class="btn btn-ghost" href="tel:${BIZ.phone}">${PHONE_ICON}<span>${t("call")}</span></a>
      </div>
      <a class="linkbtn" style="justify-self:center" href="${waURL(t("waShare")(fullName(p),link(p)),"")}" target="_blank" rel="noopener">${t("sendFriend")}</a>
    </div>`;
}
function openSheet(id, push=true){
  const p=P.find(x=>x.id===id); if(!p) return;
  current=p; renderSheet();
  if(!sheet.open){ try{sheet.showModal()}catch(e){sheet.setAttribute("open","")} }
  if(push){ try{ history.pushState({sheet:id},"","#p-"+id); pushed=true; }catch(e){} }
}
function closeSheet(fromHistory=false){
  if(!sheet.open) return;
  sheet.close(); current=null;
  if(!fromHistory){
    try{ if(pushed){ pushed=false; history.back(); } else history.replaceState(null,"",location.pathname+location.search); }catch(e){}
  } else pushed=false;
}
sheet.addEventListener("click",e=>{ if(e.target===sheet||e.target.closest("[data-close]")) closeSheet(); });
sheet.addEventListener("cancel",e=>{ e.preventDefault(); closeSheet(); });
window.addEventListener("popstate",()=>{ const m=location.hash.match(/^#p-(.+)$/); if(m) openSheet(decodeURIComponent(m[1]),false); else closeSheet(true); });

/* ===== Events ===== */
document.addEventListener("click",e=>{
  const o=e.target.closest("[data-open]"); if(o){ openSheet(o.dataset.open); return; }
  const f=e.target.closest("[data-f]"); if(f){ filter=f.dataset.f; document.querySelectorAll("[data-f]").forEach(b=>b.setAttribute("aria-pressed", b.dataset.f===filter)); renderGrid(); }
});
document.getElementById("langSel").addEventListener("change",e=>{
  lang=e.target.value; try{localStorage.setItem("de-lang",lang)}catch(err){}
  renderStatic(); renderGrid(); renderSheet();
});

/* Mobile call/WhatsApp bar appears once the hero is scrolled past, hides while a detail sheet is open */
const dock=document.getElementById("dock");
new IntersectionObserver(([en])=>dock.classList.toggle("show",!en.isIntersecting)).observe(document.querySelector(".hero"));

renderStatic(); renderGrid();
const start=location.hash.match(/^#p-(.+)$/); if(start) openSheet(decodeURIComponent(start[1]),false);
</script>
</body>
</html>
